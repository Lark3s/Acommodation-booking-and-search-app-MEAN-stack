<mat-card>
    <mat-card-header>
      <mat-card-title>Edit Accommodation</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" required>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Price</mat-label>
          <input matInput type="number" formControlName="price" required>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Longitude</mat-label>
          <input matInput type="number" formControlName="longitude" required>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Latitude</mat-label>
          <input matInput type="number" formControlName="latitude" required>
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button (click)="onCancel()">Cancel</button>
      <button mat-button color="primary" (click)="onSubmit()">Save</button>
    </mat-card-actions>
  </mat-card>
