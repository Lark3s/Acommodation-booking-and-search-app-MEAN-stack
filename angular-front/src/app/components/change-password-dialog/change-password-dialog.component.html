<h1 mat-dialog-title>Change Password</h1>
<div mat-dialog-content>
  <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="fill">
      <mat-label>Current Password</mat-label>
      <input matInput type="password" formControlName="currentPassword" placeholder="Enter current password" required>
      <mat-error *ngIf="changePasswordForm.get('currentPassword')?.hasError('required')">
        Current password is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>New Password</mat-label>
      <input matInput type="password" formControlName="newPassword" placeholder="Enter new password" required>
      <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('required')">
        New password is required
      </mat-error>
      <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
        New password must be at least 6 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Confirm New Password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" placeholder="Confirm new password" required>
      <mat-error *ngIf="changePasswordForm.hasError('mismatch')">
        Passwords do not match
      </mat-error>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!changePasswordForm.valid" (click)="onSubmit()">Confirm</button>
</div>
